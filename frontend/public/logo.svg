<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1f2128" />
      <stop offset="100%" stop-color="#0c0d11" />
    </radialGradient>
    <linearGradient id="vGrad" x1="20%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark squircle background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" />

  <!-- Letter V -->
  <path
    d="M 166 160 L 256 352 L 346 160"
    fill="none"
    stroke="url(#vGrad)"
    stroke-width="54"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#vShadow)"
  />
</svg>
